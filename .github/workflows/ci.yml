#
# 这个工作流只跑「不需要 DSH 就能跑」的那部分检查，思路是：
#
#   ✅ 能在 CI 跑（本工作流覆盖）
#      · 语法检查：server.cjs / public/app.js 能否被解析
#      · tools/render-all.mjs   —— 纯本地：用 DOM stub 跑完 18 页渲染，273 项断言，失败会 exit 1
#      · tools/make-dist.mjs    —— 打包完整性：文件齐不齐、有没有夹带本机状态文件与令牌
#      · 起服务烟测             —— 没有 DSH 时 server.cjs 也应能启动并正常返回首页
#
#   ❌ 不能在 CI 跑（需要真机环境，请本地跑）
#      · tools/test-api.mjs     —— 要活的 DSH 会话与令牌，无令牌时上游回 401
#      · tools/page-audit.mjs   —— B 部分（端点探测）要控制台代理到真 DSH；CI 里只作参考、不判定成败
#      · tools/cdp-chat-check.mjs —— 要本机 Edge 的 CDP 端口
#
# 所以：CI 绿 ≠ 全部回归通过。发版前请在跑着 `dsh web` 的机器上按 README「回归与排障」完整跑一遍。
# 项目零第三方依赖、无构建步骤，因此这里不需要 npm install。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 静态回归（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 项目要求 Node ≥ 18；这里测当前在维护的两个 LTS
        node: ['20', '22']

    steps:
      - name: 取出代码
        uses: actions/checkout@v7

      - name: 准备 Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: |
          node --check server.cjs
          node --check public/app.js
          echo "两个入口文件均可正常解析"

      - name: 18 页渲染回归（273 项断言）
        run: node tools/render-all.mjs

      - name: 打包完整性校验（不混淆、不压缩）
        run: node tools/make-dist.mjs --no-mangle --no-zip

      - name: 起服务烟测（无 DSH 时也应能启动并返回首页）
        run: |
          CONSOLE_PORT=3099 node server.cjs > console.log 2>&1 &
          SRV=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3099/ -o home.html; then ok=1; break; fi
            sleep 0.5
          done
          kill $SRV 2>/dev/null || true
          echo "--- 控制台启动日志 ---"
          cat console.log
          if [ "$ok" != "1" ]; then
            echo "::error::控制台在无 DSH 环境下未能响应首页 —— 部署方第一次启动就会卡在这里"
            exit 1
          fi
          grep -q "时空智能应用工作台" home.html \
            || { echo "::error::首页返回了内容，但不是控制台页面"; exit 1; }
          echo "烟测通过：首页正常返回"

      - name: 页面端点审计（需要真 DSH，仅作参考，不判定成败）
        continue-on-error: true
        run: |
          CONSOLE_PORT=3099 node server.cjs > /dev/null 2>&1 &
          SRV=$!
          sleep 3
          node tools/page-audit.mjs > /dev/null 2>&1 || true
          kill $SRV 2>/dev/null || true
          echo "--- page-audit 结果尾部（CI 里会因缺少 DSH 令牌而出现失败，属预期）---"
          tail -3 tools/page-audit-out.txt || true

      - name: 失败时留一份控制台日志
        if: failure()
        continue-on-error: true
        run: |
          echo "--- console.log ---"
          cat console.log || true
