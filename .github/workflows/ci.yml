#
# 这个工作流只跑「不需要 DSH 就能判定」的检查。判断依据是实测出来的，不是猜的：
#
#   ✅ 能在 CI 跑（本工作流覆盖，全部是硬性判定）
#      · 语法检查：server.cjs / public/app.js 能否被解析
#      · 打包完整性：make-dist 的文件清单 + 无本机状态文件 + 无令牌/本机路径泄漏
#      · 起服务烟测：没有 DSH 时 server.cjs 也应能启动，且本地接口正常响应
#      · 入库守卫：本机状态文件与内部资料绝不能被提交
#
#   ❌ 不能在 CI 跑（必须真机 + 跑着 dsh web）
#      · tools/render-all.mjs   —— 它把 app.js 里的 fetch 转发到 127.0.0.1:3081，
#                                  依赖控制台在跑；而页面里的数据加载还要活的 DSH 会话
#      · tools/page-audit.mjs   —— B 部分（端点探测）同上
#      · tools/test-api.mjs     —— 要真 DSH 会话与令牌
#      · tools/cdp-chat-check.mjs —— 要本机 Edge 的 CDP 端口
#
# ⚠️ 所以：**CI 绿 ≠ 全部回归通过**。发版前请在跑着 `dsh web` 的机器上按 README
#    第 6 节「全量回归」完整跑一遍，认准每个脚本末行的 `DONE fails=0`。
#
# 项目零第三方依赖、无构建步骤，因此这里不需要 npm install。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 静态检查（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 项目要求 Node ≥ 18；这里测当前在维护的两个 LTS
        node: ['20', '22']

    steps:
      - name: 取出代码
        uses: actions/checkout@v7

      - name: 准备 Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: |
          node --check server.cjs
          node --check public/app.js
          echo "两个入口文件均可正常解析"

      - name: 守卫：本机状态文件与内部资料不得入库
        run: |
          fail=0
          for f in plugins.json mcp-tools.json dsh-config.json ui-prefs.yaml dist; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f 被提交进了仓库 —— 本机运行状态不属于源码（dsh-config.json 还含访问令牌）"
              fail=1
            fi
          done
          for f in docs/chat-parity.md tools/dump-endpoints.mjs; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f 被提交进了仓库 —— 内部资料不随开源仓库分发"
              fail=1
            fi
          done
          [ "$fail" = "0" ] && echo "入库守卫通过：无本机状态文件、无内部资料"
          exit $fail

      - name: 打包完整性校验（不混淆、不压缩）
        run: node tools/make-dist.mjs --no-mangle --no-zip

      - name: 起服务烟测（无 DSH 时也应能启动，且本地接口正常响应）
        run: |
          CONSOLE_PORT=3099 node server.cjs > console.log 2>&1 &
          SRV=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3099/ -o home.html; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != "1" ]; then
            echo "--- 控制台启动日志 ---"; cat console.log
            kill $SRV 2>/dev/null || true
            echo "::error::控制台在无 DSH 环境下未能响应首页 —— 部署方第一次启动就会卡在这里"
            exit 1
          fi

          echo "首页 HTTP 200（$(wc -c < home.html) 字节）"
          grep -q "时空智能应用工作台" home.html \
            || { kill $SRV 2>/dev/null || true; echo "::error::首页返回了内容，但不是控制台页面"; exit 1; }

          # 这三个本地接口不依赖 DSH，必须在无 DSH 时也能正常返回 —— 部署方首次启动就会用到
          for p in /api/local/dsh /api/local/prefs /api/local/plugins; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3099$p")
            echo "  $p → HTTP $code"
            if [ "$code" != "200" ]; then
              kill $SRV 2>/dev/null || true
              echo "::error::$p 在无 DSH 环境下返回 $code（应为 200）"
              exit 1
            fi
          done

          kill $SRV 2>/dev/null || true
          echo "烟测通过：服务能启动，首页与本地接口均正常"

      - name: 失败时留一份控制台日志
        if: failure()
        continue-on-error: true
        run: |
          echo "--- console.log ---"
          cat console.log || true
