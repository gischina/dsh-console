<title>易智瑞西安 · 时空智能应用工作台</title>
<script>
/* 首屏上色：外观偏好（跟随系统/深色/浅色）存在 DSH 的 settings 里，要等 app.js 拉完
   settings.describe 才知道。直接等就会"先深后浅"闪一下，所以本地留一份镜像，
   在样式表之前先把 data-theme 定下来；app.js 拿到真实偏好后会覆盖成权威值。 */
(function () {
  var pref = 'system';
  try { pref = localStorage.getItem('dshThemePref') || 'system'; } catch (e) {}
  var dark = pref === 'dark';
  if (pref === 'system') {
    try { dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { dark = true; }
  }
  var t = dark ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  document.documentElement.style.colorScheme = t;
})();
/* 插件主题令牌桥：外来插件（如知识库）的界面用 DSH 的 --dsw-alias-* 变量上色。
   控制台没有 DSH 那套令牌，缺了就全走插件的兜底值 —— 插件的兜底值是**浅色**的
   （bg-base #f6f7f9 / bg-layer-1 #fff / label-primary #1f2329…），
   而控制台默认是深色，于是深色下会出现"有些块是浅底深字、有些是深底浅字"的斑驳观感。
   这里按控制台主题，把对应语义映射到本控制台已有的 --* 变量上。
   ------------------------------------------------------------------
   为什么写成样式表而不是把文件里的 `var(--dsw-x, #hex)` 换掉：
   ① 兜底值是官方默认主题的取值，按控制台主题改它需要为双主题重算两套常量，容易与实现漂移；
   ② 换行偏移会让插件 lib/ 体积反而变大（无收益）；
   ③ 将来重装 / 升级插件，这里不用重做。
   所以：**不碰插件文件**，只补变量，且每个变量都带与插件一致的兜底值。

   ⚠️ 覆盖要**求全**：插件（当前版本）共引用 14 个 --dsw-* 令牌，漏一个就那一处
   退回浅色兜底，表现就是"深色主题下这一块偏偏是亮的"。14 个全部列在下面的样式表里。
   换插件版本后重新核对一遍：grep 插件 lib/client.js 里所有 --dsw- 开头的名字，
   与下面逐个对齐即可（tools/ 里没有固化这一步，因为只在升级插件时才需要）。 */
</script>
<style>
/* 两套主题共用一份映射：右侧值全是控制台自己的 --* 变量，
   而 --* 本身在深/浅主题下取值不同，所以这里写一次就自动跟随主题切换。 */
:root,
:root[data-theme="light"] {
  --dsw-alias-bg-base:                var(--bg);        /* 面板底 */
  --dsw-alias-bg-layer-1:             var(--panel);     /* 卡片面 */
  --dsw-alias-bg-layer-2:             var(--panel-2);   /* 次级面 */
  --dsw-alias-bg-overlay:             var(--panel);     /* 浮层底 */
  --dsw-alias-border-l2:              var(--line-2);
  --dsw-alias-border-l3:              var(--line);
  --dsw-alias-label-primary:          var(--txt);
  --dsw-alias-label-primary-foreground: #fff;           /* 品牌色按钮上的字：两套主题都取白 */
  --dsw-alias-brand-primary:          var(--brand);
  --dsw-alias-state-error-primary:    var(--err);
  --dsw-alias-state-warn-primary:     var(--warn);
  --dsw-alias-state-success-primary:  var(--ok);
  --dsw-alias-state-business-primary: var(--brand);
  /* 主按钮 hover：插件自带兜底（#43454a 深灰），两套主题下观感都可接受，故保留不动 */
}
</style>
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<script>
/* 部署时最常见的坑：直接双击本文件用 file:// 打开。
   那样 /style.css 与 /app.js 会被解析成 file:///C:/style.css 之类，全部取不到，
   页面就成了空白/无样式，而且一条 /api 请求都不会发出去。
   这里用内联脚本兜底（不依赖任何外部文件），直接把正确用法写在页面上。 */
if (location.protocol === 'file:') {
  document.documentElement.innerHTML =
    '<body style="margin:0;font:14px/1.8 system-ui,\'Microsoft YaHei\',sans-serif;background:#0a1020;color:#e8eefc">'
    + '<div style="max-width:640px;margin:12vh auto;padding:28px 32px;border:1px solid #27406f;border-radius:12px;background:#111c38">'
    + '<h2 style="margin:0 0 14px;font-size:19px">⚠️ 打开方式不对：不要双击 index.html</h2>'
    + '<p style="color:#9fb0d0">你现在是用 <code style="background:#0b1428;padding:1px 6px;border-radius:5px">file://</code> 打开的本地文件。'
    + '本控制台需要后端进程，前端资源与所有接口都由它提供，所以直接打开这个文件只会是一张空白页。</p>'
    + '<p style="color:#9fb0d0">正确做法：</p>'
    + '<ol style="color:#e8eefc;padding-left:22px">'
    + '<li>先启动 DSH 主机（另开 PowerShell 窗口）：<code style="background:#0b1428;padding:1px 6px;border-radius:5px">dsh web</code></li>'
    + '<li>回到 dsh-console 目录，双击 <b>start.cmd</b>（或执行 <code style="background:#0b1428;padding:1px 6px;border-radius:5px">node server.cjs</code>）</li>'
    + '<li>浏览器访问控制台启动时打印的那个地址（默认 <b style="color:#41d1ff">http://127.0.0.1:3081</b>）</li>'
    + '</ol>'
    + '<p style="color:#6d7fa3;font-size:12.5px;margin-top:18px">若控制台启动时报错，请双击同目录下的 <b>check.cmd</b> 做一次部署自检，把输出发给管理员。</p>'
    + '</div></body>';
}
</script>
<div class="app">
  <header class="header">
    <div class="logo">
      <span class="brand-org">易智瑞西安</span>
      <span class="brand-sep">·</span>
      <span class="brand-name">时空智能应用工作台</span>
    </div>
    <button class="sidetoggle" id="sidetoggle" onclick="toggleSide()" title="折叠/展开侧栏">☰</button>
    <nav class="nav" id="nav"></nav>
    <div class="hstatus" id="hstatus"><span class="loading"></span> 连接中…</div>
  </header>
  <div class="main">
    <aside class="side" id="side"></aside>
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      <div class="scopebar" id="scopebar" style="display:none"></div>
      <main class="content" id="content"></main>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
